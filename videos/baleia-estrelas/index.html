<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0f3347; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      /* grão de papel: textura fixa por cima das cenas, por baixo das legendas */
      #grain { position: absolute; inset: 0; z-index: 5; opacity: 0.06; pointer-events: none; mix-blend-mode: overlay; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="5" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="5" data-duration="5" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="10" data-duration="5" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4.html" data-start="15" data-duration="5" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="s5" data-composition-id="s5" data-composition-src="compositions/s5.html" data-start="20" data-duration="5" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="s6" data-composition-id="s6" data-composition-src="compositions/s6.html" data-start="25" data-duration="5" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <svg id="grain" data-layout-ignore viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
        <filter id="grain-f"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/><feColorMatrix type="saturate" values="0"/></filter>
        <rect width="1080" height="1920" filter="url(#grain-f)"/>
      </svg>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="30" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 10"></div>
      <audio id="sfx-glide" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="0.221" data-duration="0.575" data-track-index="3" data-volume="0.3"></audio>
      <audio id="sfx-bubble-pop" class="clip" src="assets/sfx/pop.mp3" data-start="8.513" data-duration="0.72" data-track-index="3" data-volume="0.35"></audio>
      <audio id="sfx-spout" class="clip" src="assets/sfx/sparkle.mp3" data-start="11.056" data-duration="1.802" data-track-index="3" data-volume="0.4"></audio>
      <audio id="sfx-star1" class="clip" src="assets/sfx/chime.mp3" data-start="15.215" data-duration="2.544" data-track-index="3" data-volume="0.35"></audio>
      <audio id="sfx-star2" class="clip" src="assets/sfx/pop.mp3" data-start="16.513" data-duration="0.72" data-track-index="4" data-volume="0.3"></audio>
      <audio id="sfx-star3" class="clip" src="assets/sfx/click-soft.mp3" data-start="17.560" data-duration="0.366" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-wave" class="clip" src="assets/sfx/sparkle.mp3" data-start="20.406" data-duration="1.802" data-track-index="3" data-volume="0.4"></audio>
      <audio id="sfx-goodnight" class="clip" src="assets/sfx/chime.mp3" data-start="25.315" data-duration="2.544" data-track-index="3" data-volume="0.35"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
